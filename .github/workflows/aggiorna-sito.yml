# Aggiorna il briefing e pubblica il sito (istruzioni: PUBBLICAZIONE.md)
name: Aggiorna briefing e sito
on:
  push:
    branches: [main]
  schedule:
    # Ora UTC: Roma = UTC+1 d'inverno, UTC+2 d'estate
    - cron: "40 6 * * 1-5"
    - cron: "10 12 * * 1-5"
    - cron: "40 16 * * 1-5"
    - cron: "30 22 * * 1-5"
    - cron: "0 20 * * 0"
  workflow_dispatch:
concurrency:
  group: briefing
  cancel-in-progress: false
jobs:
  briefing:
    name: Genera il briefing
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pages: write
    outputs:
      pages: ${{ steps.pages.outcome }}
    steps:
      - uses: actions/checkout@v6
      - name: Installa il pacchetto caricato
        run: |
          p=""
          for z in *.zip; do
            if [ -f "$z" ] && unzip -l "$z" | grep -q run_briefing.py; then p="$z"; break; fi
          done
          if [ -n "$p" ]; then
            t="$(mktemp -d)"
            unzip -q -o "$p" -d "$t"
            d="$(dirname "$(find "$t" -name run_briefing.py | head -n 1)")"
            rm -rf "$d/.github"
            cp -a "$d/." .
            git rm -q --cached -- "$p"
            rm -f -- "$p"
          fi
          if [ ! -f xau/engine.py ]; then
            echo "::error::Manca il progetto. Carica nel repository il file xauusd-github.zip"
            exit 1
          fi
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Genera briefing e sito
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python run_briefing.py
      - name: Salva piani e archivio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f xauusd-sito.zip
          mkdir -p .git/info
          printf 'site/\n*.zip\n__pycache__/\noutput/cache/calendar_*\n' >> .git/info/exclude
          git add -A
          if ! git diff --cached --quiet; then
            git commit -q -m "Briefing del $(TZ=Europe/Rome date '+%d/%m/%Y %H:%M')"
            git push || { git pull --rebase && git push; }
          fi
      - name: Pages attivo?
        id: pages
        uses: actions/configure-pages@v5
        continue-on-error: true
      - if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - if: steps.pages.outcome != 'success'
        run: echo "::warning::GitHub Pages non attivo. Briefing salvato, sito non pubblicato. Settings, Pages, Source = GitHub Actions"
  pubblica:
    name: Pubblica il sito
    needs: briefing
    if: needs.briefing.outputs.pages == 'success'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
